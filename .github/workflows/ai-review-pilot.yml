name: AI Reviewer Gemini Pilot (manual)

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Um caso do benchmark por execucao
        type: choice
        required: true
        default: r22-typ-001
        options:
          - r22-typ-001
          - r22-ddl-001
          - r22-ci-001
      reasoning_profile:
        description: Perfil de raciocinio allowlisted (2048 baseline, 4096 experimental)
        type: choice
        required: true
        default: gemini-thinking-2048
        options:
          - gemini-thinking-2048
          - gemini-thinking-4096-compact
      mode:
        description: CHECK_ONLY nunca executa chamada paga
        type: choice
        required: true
        default: CHECK_ONLY
        options:
          - CHECK_ONLY
          - EXECUTE_PAID
      confirm:
        description: Confirmar UMA chamada paga apos limitar a chave
        type: choice
        required: true
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - ONE_PAID_CALL

permissions:
  contents: read

concurrency:
  group: ai-review-pilot-manual-owner
  cancel-in-progress: false

jobs:
  diagnose_authorization:
    name: Diagnostic of pilot gates (no model call)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report boolean gate results without secrets
        shell: bash
        env:
          GATE_VARIABLE: ${{ vars.AI_REVIEW_PILOT_ENABLED == 'true' }}
          GATE_REPOSITORY: ${{ github.repository == 'gavvalverde/SEAGBH-source' }}
          GATE_ACTOR: ${{ github.actor == 'gavvalverde' }}
          GATE_TRIGGERING_ACTOR: ${{ github.triggering_actor == 'gavvalverde' }}
          GATE_FIRST_ATTEMPT: ${{ github.run_attempt == '1' }}
          GATE_EVENT: ${{ github.event_name == 'workflow_dispatch' }}
          GATE_BRANCH: ${{ github.ref == 'refs/heads/main' }}
          GATE_CONFIRMATION: ${{ inputs.confirm == 'ONE_PAID_CALL' }}
          GATE_PAID_MODE: ${{ inputs.mode == 'EXECUTE_PAID' }}
        run: |
          set -euo pipefail
          printf 'variable_enabled_match=%s\n' "$GATE_VARIABLE"
          printf 'repository_match=%s\n' "$GATE_REPOSITORY"
          printf 'actor_match=%s\n' "$GATE_ACTOR"
          printf 'triggering_actor_match=%s\n' "$GATE_TRIGGERING_ACTOR"
          printf 'first_attempt_match=%s\n' "$GATE_FIRST_ATTEMPT"
          printf 'event_match=%s\n' "$GATE_EVENT"
          printf 'branch_match=%s\n' "$GATE_BRANCH"
          printf 'confirmation_match=%s\n' "$GATE_CONFIRMATION"
          printf 'paid_mode_match=%s\n' "$GATE_PAID_MODE"
          printf '%s\n' 'Diagnostic only: no API calls, no access to model credentials.'

  single_paid_pilot:
    if: >-
      vars.AI_REVIEW_PILOT_ENABLED == 'true' &&
      github.repository == 'gavvalverde/SEAGBH-source' &&
      github.actor == 'gavvalverde' &&
      github.triggering_actor == 'gavvalverde' &&
      github.run_attempt == '1' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'EXECUTE_PAID' &&
      inputs.confirm == 'ONE_PAID_CALL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main workflow SHA only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gavvalverde/SEAGBH-source
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/ai-review/benchmarks/cases/
            /.github/ai-review/ground-truth/
            /.github/ai-review/benchmarks/harness/
            /.github/ai-review/production/
            /.github/ai-review/review-schema.json
      - name: Install pinned test dependencies
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/ai-pilot-venv"
          "$RUNNER_TEMP/ai-pilot-venv/bin/python" -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple -r .github/ai-review/production/requirements-test.txt
      - name: Execute exactly one approved paid comparison
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEAGBH_AI_PILOT_PAID_ENABLED: owner_confirmed
          SEAGBH_AI_PILOT_TRUSTED_ACTIONS: 'true'
          PILOT_CASE: ${{ inputs.case_id }}
          PILOT_PROFILE: ${{ inputs.reasoning_profile }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/ai-pilot-venv/bin/python" -B .github/ai-review/benchmarks/harness/pilot_guarded.py \
            --case "$PILOT_CASE" \
            --profile "$PILOT_PROFILE" \
            --paid --confirm-single-paid-call --max-usd 0.05
