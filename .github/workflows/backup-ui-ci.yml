name: SQLite Backup Qt Integration Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ui/__init__.py"
      - "src/main_qt.py"
      - "src/ui/consulta_database_thread.py"
      - "src/ui/dialogs_utils.py"
      - "src/ui/main_window.py"
      - "src/ui/tab_dashboard.py"
      - "src/core/__init__.py"
      - "src/core/atualizacao.py"
      - "src/core/barreira_sqlite.py"
      - "src/core/conexao_sqlite_protegida.py"
      - "src/core/database.py"
      - "src/core/backup_sqlite.py"
      - "tests/__init__.py"
      - "tests/unit/__init__.py"
      - "tests/unit/test_backup_ui.py"
      - "tests/unit/test_database_sqlite_protegido.py"
      - "tests/unit/test_encerramento_gui.py"
      - "tests/unit/test_restauracao_bloqueada_ui.py"
      - "tests/unit/test_backup_sqlite.py"
      - "tests/requirements-backup-ui.txt"
      - ".github/workflows/backup-ui-ci.yml"

permissions:
  contents: read

jobs:
  backup-ui:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nome: backup-ui
          - os: windows-2022
            nome: backup-ui (Windows)
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install native Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Shared OpenGL/EGL libraries used by the binary Qt GUI modules.
          # No X server or visible desktop is started.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - name: Install isolated Qt test dependencies with hashes
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import venv

          assert sys.version_info[:2] == (3, 12), sys.version
          raiz = Path(os.environ["RUNNER_TEMP"])
          os.environ.update(TMPDIR=str(raiz), TEMP=str(raiz), TMP=str(raiz))
          ambiente = raiz / "backup-ui-ci-venv"
          venv.EnvBuilder(with_pip=True).create(ambiente)
          python = ambiente / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          pip = [str(python), "-B", "-m", "pip", "--isolated", "--disable-pip-version-check"]
          subprocess.run([*pip, "--no-input", "install", "--only-binary=:all:",
                          "--require-hashes", "--index-url", "https://pypi.org/simple",
                          "-r", "tests/requirements-backup-ui.txt"], check=True, timeout=240)
          subprocess.run([*pip, "check"], check=True, timeout=30)
      - name: Verify Python 3.12 and run Qt offscreen and SQLite regressions
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          raiz = Path(os.environ["RUNNER_TEMP"])
          ambiente = raiz / "backup-ui-ci-venv"
          python = ambiente / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          temporario = raiz / "backup-ui-tmp"
          temporario.mkdir(mode=0o700)
          env = dict(os.environ, TMPDIR=str(temporario), TEMP=str(temporario), TMP=str(temporario))
          if os.name != "nt":
              runtime = raiz / "backup-ui-runtime"
              runtime.mkdir(mode=0o700)
              env["XDG_RUNTIME_DIR"] = str(runtime)
          diagnostico = """
          import os
          import platform
          import sqlite3
          import sys
          from importlib.metadata import version
          from PyQt6.QtCore import QLibraryInfo
          from PyQt6.QtTest import QSignalSpy, QTest
          from PyQt6.QtWidgets import QApplication

          assert sys.version_info[:2] == (3, 12), sys.version
          assert sys.prefix != sys.base_prefix, "Isolated virtual environment required"
          assert os.environ["QT_QPA_PLATFORM"] == "offscreen"
          print("Platform:", platform.platform())
          print("Python:", sys.version)
          print("SQLite:", sqlite3.sqlite_version)
          for package in ("PyQt6", "PyQt6-Qt6", "PyQt6-sip"):
              print(package + ":", version(package))
          print("Qt runtime:", QLibraryInfo.version().toString())
          app = QApplication([])
          assert app.platformName() == "offscreen", app.platformName()
          print("Qt platform:", app.platformName())
          """
          comando = [str(python), "-B", "-W", "error::ResourceWarning"]
          subprocess.run([*comando, "-c", diagnostico], check=True, timeout=30, env=env)
          for modulos in (
              ["tests.unit.test_backup_ui", "tests.unit.test_restauracao_bloqueada_ui"],
              ["tests.unit.test_encerramento_gui"],
              ["tests.unit.test_backup_sqlite"],
          ):
              subprocess.run([*comando, "-m", "unittest", "-v", *modulos],
                             check=True, timeout=120, env=env)
