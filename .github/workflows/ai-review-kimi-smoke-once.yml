name: One-time Kimi K2.6 Baidu synthetic endpoint smoke

on:
  push:
    branches: [feat/ai-review-kimi-k26-economico]
    paths: [.github/workflows/ai-review-kimi-smoke-once.yml]

permissions: {}

jobs:
  smoke:
    if: >-
      github.repository == 'gavvalverde/SEAGBH-source' &&
      github.event.head_commit.message == 'test(ai-review): executar homologacao Kimi K2.6 uma vez' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: One synthetic non-retrying request, no checkout and no GitHub token
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3.12 -B - <<'PY'
          import http.client
          import json
          import os
          import sys

          def fail(code, http_status=None):
              record = {"status": "fail", "reason": code}
              if type(http_status) is int:
                  record["http_status"] = http_status
              print(json.dumps(record, sort_keys=True))
              sys.exit(1)

          key = os.environ.get("OPENROUTER_API_KEY", "")
          if not key or len(key) > 2048 or "\n" in key or "\r" in key:
              fail("api_key_unavailable")

          payload = {
              "model": "moonshotai/kimi-k2.6",
              "messages": [
                  {"role": "system", "content": "You must answer with exactly one JSON object, with keys ok and probe, and no extra text."},
                  {"role": "user", "content": "Return JSON with ok set to true and probe set to k26."}
              ],
              "temperature": 0.3,
              "max_tokens": 8192,
              "reasoning": {"enabled": False},
              "response_format": {"type": "json_object"},
              "provider": {
                  "only": ["baidu"], "allow_fallbacks": False,
                  "require_parameters": True,
                  "max_price": {"prompt": 0.42, "completion": 1.75}
              }
          }
          connection = None
          try:
              connection = http.client.HTTPSConnection("openrouter.ai", timeout=110)
              connection.request(
                  "POST", "/api/v1/chat/completions",
                  body=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://github.com/gavvalverde/SEAGBH-source",
                      "X-Title": "SEAGBH synthetic Kimi endpoint check"
                  }
              )
              reply = connection.getresponse()
              http_status = reply.status
              data = reply.read(32769)
          except (OSError, TimeoutError, ValueError, http.client.HTTPException):
              fail("network_or_transport_error")
          finally:
              if connection is not None:
                  connection.close()

          if http_status != 200:
              fail("http_error", http_status)
          if len(data) > 32768:
              fail("response_oversize")
          try:
              envelope = json.loads(data)
              choice = envelope["choices"][0]
              message = choice["message"]
              usage = envelope["usage"]
              details = usage["completion_tokens_details"]
              output = json.loads(message["content"])
          except (TypeError, KeyError, ValueError, IndexError, AttributeError):
              fail("invalid_response_or_usage")

          if envelope.get("model") != "moonshotai/kimi-k2.6":
              fail("model_mismatch")
          if choice.get("finish_reason") != "stop":
              fail("completion_not_stopped")
          if not isinstance(message, dict) or any(message.get(k) for k in ("reasoning", "reasoning_content", "reasoning_details")):
              fail("reasoning_content_detected")
          if type(details.get("reasoning_tokens")) is not int:
              fail("reasoning_usage_unverifiable")
          if details["reasoning_tokens"] != 0:
              fail("reasoning_not_disabled")
          if type(usage.get("completion_tokens")) is not int or not 0 <= usage["completion_tokens"] <= 8192:
              fail("completion_usage_invalid")
          if not isinstance(output, dict) or output.get("ok") is not True or output.get("probe") != "k26":
              fail("json_content_mismatch")

          result = {"status": "success", "model": "kimi-k2.6",
                    "reasoning_tokens": 0, "completion_tokens": usage["completion_tokens"],
                    "finish_reason": "stop"}
          cost = usage.get("cost")
          if type(cost) in (int, float) and 0 <= cost < 1:
              result["cost_micro_usd"] = round(cost * 1000000)
          print(json.dumps(result, sort_keys=True))
          PY
