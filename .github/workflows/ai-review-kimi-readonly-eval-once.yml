name: One-time Kimi real PRs read-only evaluation

on:
  push:
    branches: [fix/ai-review-kimi-structured-evidence]
    paths: [.github/workflows/ai-review-kimi-readonly-eval-once.yml]

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate:
    if: >-
      github.repository == 'gavvalverde/SEAGBH-source' &&
      github.event.head_commit.message == 'test(ai-review): avaliar PR16 PR28 uma vez sem publicar' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout only trusted branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gavvalverde/SEAGBH-source
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/ai-review/production/
            /.github/ai-review/benchmarks/harness/prompt_builder.py
            /.github/ai-review/review-schema.json
      - name: Install pinned reviewer requirements in venv
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/kimi-eval-venv"
          "$RUNNER_TEMP/kimi-eval-venv/bin/python" -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple -r .github/ai-review/production/requirements.txt
      - name: Evaluate exact two PR SHAs without writing or retrying
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/kimi-eval-venv/bin/python" -B - <<'PY'
          import json
          import os
          import sys
          
          sys.path.insert(0, ".github/ai-review/production")
          import runner as r
          from transport import OpenRouter, Problem
          
          EXPECTED = (
              (16, "6721e83a5c5c2c1844c78f6d47e133962419fd90"),
              (28, "219bfba2dcddabfd4ce7318157777c19a1319c40"),
          )
          
          class ReadOnlyGithub(r.GitHub):
              def __init__(self, token):
                  super().__init__(token)
                  self.would_publish = False
          
              def post(self, pinned, body):
                  # Absolutely no POST to GitHub is allowed by this experiment.
                  self.would_publish = True
                  raise Problem("dry_run_publication_blocked")
          
          key = os.environ.get("OPENROUTER_API_KEY")
          token = os.environ.get("GITHUB_TOKEN")
          if not key or not token:
              print('{"status":"missing_credential"}')
              sys.exit(1)
          
          results = []
          for number, expected_sha in EXPECTED:
              github = ReadOnlyGithub(token)
              try:
                  pr = github.pr(number)
                  if (pr.get("head", {}).get("sha") != expected_sha or
                          pr.get("state") != "open" or pr.get("draft") is not False):
                      results.append({"pr": number, "code": "identity_not_matching", "called_model": False})
                      continue
                  event = {
                      "action": "opened", "number": number,
                      "repository": {"full_name": r.REPOSITORY, "default_branch": "main"},
                      "pull_request": pr,
                  }
                  model = OpenRouter(key, max_attempts=1, require_reasoning_usage=True)
                  outcome = r.run_review(event, "true", github, model, version="kimi-structured-dryrun-v1")
                  record = {"pr": number, "code": outcome.code, "stage": outcome.stage,
                            "would_publish": github.would_publish,
                            "published_to_github": False,
                            "quality_hold_count": outcome.quality_hold_count,
                            "quality_quote_mismatch_count": outcome.quality_quote_mismatch_count,
                            "quality_source_unavailable_count": outcome.quality_source_unavailable_count,
                            "quality_short_line_count": outcome.quality_short_line_count,
                            "quality_invalid_reference_count": outcome.quality_invalid_reference_count}
                  if outcome.validation_reason:
                      record["validation_reason"] = outcome.validation_reason
                  if model.last_usage is not None:
                      record["usage"] = model.last_usage
                  if model.last_reasoning_control in r.REASONING_CONTROL_CODES:
                      record["reasoning_control"] = model.last_reasoning_control
                  results.append(record)
              except Problem as error:
                  results.append({"pr": number, "code": error.code, "published_to_github": False})
          
          for result in results:
              print(json.dumps(result, sort_keys=True))
          if len(results) != 2 or any(item["code"] == "identity_not_matching" for item in results):
              sys.exit(1)
          PY
