name: One-shot Kimi reasoning budget experiment
on:
  push:
    branches: [fix/ai-review-kimi-structured-evidence]
    paths:
      - ".github/workflows/kimi-reasoning-eval-one-shot.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate:
    if: >-
      github.repository == 'gavvalverde/SEAGBH-source' &&
      github.event.head_commit.message == 'test(ai-review): medir raciocinio Kimi 2048 sem publicacao' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gavvalverde/SEAGBH-source
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/ai-review/production/
            /.github/ai-review/benchmarks/harness/prompt_builder.py
            /.github/ai-review/review-schema.json
      - name: Install pinned dependencies in an isolated venv
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/kimi-reasoning-venv"
          "$RUNNER_TEMP/kimi-reasoning-venv/bin/python" -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple -r .github/ai-review/production/requirements.txt
      - name: Evaluate three bounded reasoning requests without GitHub writes
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/kimi-reasoning-venv/bin/python" -B - <<'PY'
          import json
          import os
          import sys
          
          sys.path.insert(0, ".github/ai-review/production")
          import core
          import runner as r
          import quality_gate
          from transport import OpenRouter, Problem
          
          CASES = (
              (16, "6721e83a5c5c2c1844c78f6d47e133962419fd90", "budget_2048"),
              (28, "219bfba2dcddabfd4ce7318157777c19a1319c40", "budget_2048"),
              (16, "6721e83a5c5c2c1844c78f6d47e133962419fd90", "enabled_default"),
          )
          key = os.environ.get("OPENROUTER_API_KEY")
          token = os.environ.get("GITHUB_TOKEN")
          if not key or not token:
              print('{"diagnostic":"credentials_unavailable"}')
              sys.exit(1)
          gh = r.GitHub(token)
          for number, sha, setting in CASES:
              record = {"pr": number, "setting": setting, "published": False}
              try:
                  data = gh.pr(number)
                  if (data.get("head", {}).get("sha") != sha
                      or data.get("state") != "open"
                      or data.get("draft") is not False
                      or data.get("base", {}).get("ref") != "main"):
                      record["code"] = "pr_identity_mismatch"
                      print(json.dumps(record, sort_keys=True))
                      sys.exit(1)
                  event = {"number": number, "action": "opened",
                           "repository": {"full_name": r.REPOSITORY, "default_branch": "main"},
                           "pull_request": data}
                  pinned = r.event_snapshot(event, "true")
                  r.ensure_current(gh, pinned)
                  collected = r.collect(gh, pinned)
                  excerpts = r.source_context(gh, pinned, collected)
                  title = pinned.title.encode("utf-8")[:1024].decode("utf-8", errors="ignore")
                  body = pinned.body.encode("utf-8")[:4096].decode("utf-8", errors="ignore")
                  collected.manifest["partial"] |= title != pinned.title or body != pinned.body
                  context = dict(collected.manifest)
                  if excerpts:
                      context["source_snippets"] = excerpts
                  payload = r.build_production_payload(
                      title, body, collected.diff,
                      context=json.dumps(context, ensure_ascii=True, sort_keys=True),
                      trunc_note="[PARTIAL REVIEW]" if collected.manifest["partial"] else "",
                      omit_info=json.dumps(collected.manifest["omitted"], ensure_ascii=True)
                          if collected.manifest["omitted"] else "",
                      code_lines=collected.code_lines,
                  )
                  payload["reasoning"] = ({"max_tokens": 2048}
                                          if setting == "budget_2048"
                                          else {"enabled": True})
                  assert payload["max_tokens"] == 8192
                  assert payload["provider"]["only"] == ["baidu"]
                  assert payload["provider"]["allow_fallbacks"] is False
                  assert payload["provider"]["require_parameters"] is True
                  assert payload["response_format"]["type"] == "json_schema"
                  model = OpenRouter(key, max_attempts=1, require_reasoning_usage=True)
                  content = model.complete(payload)
                  record["usage"] = model.last_usage
                  record["reasoning_control"] = model.last_reasoning_control
                  if model.last_usage is None or type(model.last_usage.get("reasoning_tokens")) is not int:
                      record["thinking_signal"] = "unverifiable"
                  else:
                      count = model.last_usage["reasoning_tokens"]
                      record["thinking_signal"] = ("absent" if count == 0 else
                                                   "positive_within_requested_budget"
                                                   if setting == "budget_2048" and count <= 2048 else
                                                   "positive_over_requested_budget"
                                                   if setting == "budget_2048" else
                                                   "positive_default")
                  r.ensure_current(gh, pinned)
                  result = core.process_response(content, collected.scope,
                       expected_sha=pinned.head_sha, response_sha=pinned.head_sha)
                  record["validation"] = result.status.value
                  if not result.publishable:
                      record["code"] = "validation_rejected"
                      record["validation_reason"] = result.reason
                  else:
                      q = quality_gate.assess(result.review["findings"], collected.code_lines)
                      record.update({
                          "finding_count": len(result.review["findings"]),
                          "hold_count": q.unanchored_count,
                          "mismatch_count": q.quote_mismatch_count,
                          "short_line_count": q.short_line_count,
                          "duplicate_pairs": q.duplicate_location_pairs,
                      })
                      record["code"] = ("quality_rejected" if q.requires_manual_review
                                        else "gates_passed_no_publication")
              except Problem as error:
                  record["code"] = error.code
              except Exception:
                  record["code"] = "unexpected_execution_error"
              print(json.dumps(record, sort_keys=True), flush=True)
              if record["code"] in ("pr_identity_mismatch", "unexpected_execution_error"):
                  sys.exit(1)
          print('{"evaluation":"finished","planned_calls":3,"github_post_attempts":0}')
          PY
