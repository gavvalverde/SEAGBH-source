name: One-time Kimi Baidu JSON Schema smoke

on:
  push:
    branches: [fix/ai-review-kimi-structured-evidence]
    paths: [.github/workflows/ai-review-kimi-json-schema-once.yml]

permissions: {}

jobs:
  smoke:
    if: >-
      github.repository == 'gavvalverde/SEAGBH-source' &&
      github.event.head_commit.message == 'test(ai-review): homologar schema Kimi uma vez' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Execute exactly one synthetic request without checkout or write permissions
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import http.client
          import json
          import os
          import sys
          
          def fail(code, status=None):
              result = {"status": "fail", "reason": code}
              if type(status) is int:
                  result["http_status"] = status
              print(json.dumps(result, sort_keys=True))
              sys.exit(1)
          
          key = os.environ.get("OPENROUTER_API_KEY", "")
          if not key or len(key) > 2048 or "\n" in key or "\r" in key:
              fail("key_unavailable")
          
          remote_schema = json.loads("{\"title\":\"SEAGBH AI PR Review Output\",\"description\":\"Schema de saída do revisor automático de Pull Requests do SEAGBH. Validado antes de publicar como COMMENT no PR.\",\"type\":\"object\",\"required\":[\"summary\",\"findings\"],\"additionalProperties\":false,\"properties\":{\"summary\":{\"type\":\"string\",\"minLength\":1,\"maxLength\":1500,\"description\":\"Resumo da revisão. Deve refletir honestamente o escopo (ver reviewer-rules.md seção H).\"},\"reviewed_scope\":{\"type\":\"string\",\"maxLength\":2000,\"description\":\"Descrição do que foi efetivamente analisado. Citar manifest de omissões quando houver.\"},\"confidence_overall\":{\"enum\":[\"high\",\"medium\",\"low\"],\"description\":\"Confiança geral do reviewer na revisão. low = contexto limitado ou diffs parciais.\"},\"findings\":{\"type\":\"array\",\"maxItems\":25,\"description\":\"Lista de findings. Array vazio = nenhum problema encontrado.\",\"items\":{\"type\":\"object\",\"required\":[\"severity\",\"category\",\"path\",\"line\",\"title\",\"body\",\"confidence\",\"evidence\"],\"additionalProperties\":false,\"properties\":{\"id\":{\"type\":\"string\",\"maxLength\":100,\"description\":\"Identificador estável do finding (ex: 'SEC-001', 'REG-003'). Usado para deduplicação entre revisões.\"},\"severity\":{\"enum\":[\"critical\",\"important\",\"minor\",\"informational\"],\"description\":\"Severidade. Ver severity.md para definição precisa.\"},\"category\":{\"enum\":[\"regression\",\"edge-case\",\"unhandled-state\",\"exception-handling\",\"race\",\"security\",\"data-integrity\",\"broken-api\",\"insufficient-test\",\"out-of-scope\",\"other\"],\"description\":\"Categoria do problema. Ver reviewer-rules.md seção B.\"},\"path\":{\"type\":\"string\",\"minLength\":1,\"description\":\"Caminho do arquivo (relativo à raiz do repositório).\"},\"line\":{\"type\":[\"integer\",\"null\"],\"minimum\":1,\"description\":\"Número da linha no arquivo. null quando o finding é sobre o arquivo como um todo (ex: arquivo ausente).\"},\"title\":{\"type\":\"string\",\"minLength\":3,\"maxLength\":160,\"description\":\"Título conciso do finding.\"},\"body\":{\"type\":\"string\",\"minLength\":10,\"maxLength\":1500,\"description\":\"Descrição detalhada: o que é o problema, por que importa, qual a consequência.\"},\"evidence\":{\"type\":\"string\",\"minLength\":5,\"maxLength\":2000,\"description\":\"Trecho verbatim do código ou referência precisa ao contexto que sustenta o finding.\"},\"confidence\":{\"enum\":[\"high\",\"medium\",\"low\"],\"description\":\"Confiança do reviewer neste finding específico.\"},\"suggested_fix\":{\"type\":\"string\",\"maxLength\":1000,\"description\":\"Sugestão opcional de correção.\"},\"out_of_diff\":{\"type\":\"boolean\",\"default\":false,\"description\":\"true quando a linha apontada não está no diff mas é justificada por contexto cruzado.\"},\"out_of_diff_justification\":{\"type\":\"string\",\"minLength\":10,\"maxLength\":500,\"description\":\"Justificativa obrigatória quando out_of_diff=true. Deve referenciar linha alterada ou dependência cruzada.\"}}}}}}")
          payload = {
              "model": "moonshotai/kimi-k2.6",
              "messages": [
                  {"role": "system", "content": "Produce exactly one valid JSON object matching the supplied schema, no markdown."},
                  {"role": "user", "content": "This is a synthetic schema compatibility test. Return summary: Checagem sintetica, findings: [], reviewed_scope: Exemplo sintetico, confidence_overall: low."},
              ],
              "temperature": 0.3,
              "max_tokens": 8192,
              "reasoning": {"enabled": False},
              "response_format": {"type": "json_schema", "json_schema": {
                  "name": "seagbh_code_review", "strict": False, "schema": remote_schema}},
              "provider": {"only": ["baidu"], "allow_fallbacks": False,
                           "require_parameters": True,
                           "max_price": {"prompt": 0.42, "completion": 1.75}},
          }
          connection = None
          try:
              connection = http.client.HTTPSConnection("openrouter.ai", timeout=110)
              connection.request(
                  "POST", "/api/v1/chat/completions",
                  body=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                  headers={"Authorization": "Bearer " + key,
                           "Content-Type": "application/json",
                           "HTTP-Referer": "https://github.com/gavvalverde/SEAGBH-source",
                           "X-Title": "SEAGBH synthetic Kimi JSON Schema probe"}
              )
              response = connection.getresponse()
              status = response.status
              body = response.read(32769)
          except (OSError, TimeoutError, ValueError, http.client.HTTPException):
              fail("network_or_transport_error")
          finally:
              if connection is not None:
                  connection.close()
          
          if status != 200:
              fail("http_error", status)
          if len(body) > 32768:
              fail("response_oversize")
          try:
              envelope = json.loads(body)
              choice = envelope["choices"][0]
              message = choice["message"]
              content = json.loads(message["content"])
              usage = envelope["usage"]
              reasoning = usage["completion_tokens_details"]["reasoning_tokens"]
              completion = usage["completion_tokens"]
          except (ValueError, TypeError, KeyError, IndexError, AttributeError):
              fail("json_or_usage_invalid")
          if envelope.get("model") != "moonshotai/kimi-k2.6":
              fail("wrong_model")
          if choice.get("finish_reason") != "stop":
              fail("incomplete_finish")
          if type(reasoning) is not int or reasoning != 0:
              fail("reasoning_not_verified_zero")
          if type(completion) is not int or completion < 0 or completion > 8192:
              fail("completion_usage_invalid")
          if any(message.get(k) for k in ("reasoning", "reasoning_content", "reasoning_details")):
              fail("reasoning_content_returned")
          if (not isinstance(content, dict)
                  or not isinstance(content.get("summary"), str)
                  or not isinstance(content.get("findings"), list)
                  or len(content["findings"]) != 0
                  or any(k not in remote_schema["properties"] for k in content)):
              fail("schema_content_mismatch")
          result = {"status": "success", "model": "kimi-k2.6",
                    "reasoning_tokens": 0, "completion_tokens": completion,
                    "format": "json_schema", "findings_count": 0}
          cost = usage.get("cost")
          if type(cost) in (int, float) and 0 <= cost < 1:
              result["cost_micro_usd"] = round(cost * 1000000)
          print(json.dumps(result, sort_keys=True))
