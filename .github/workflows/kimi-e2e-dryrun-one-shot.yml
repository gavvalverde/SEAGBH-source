name: One-shot end-to-end Kimi catalog dry-run
on:
  push:
    branches: [fix/ai-review-kimi-structured-evidence]
    paths:
      - ".github/workflows/kimi-e2e-dryrun-one-shot.yml"
permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate:
    if: >-
      github.repository == 'gavvalverde/SEAGBH-source' &&
      github.event.head_commit.message == 'test(ai-review): validar fluxo real Kimi sem postagem' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only trusted candidate code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gavvalverde/SEAGBH-source
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/ai-review/production/
            /.github/ai-review/benchmarks/harness/prompt_builder.py
            /.github/ai-review/review-schema.json
      - name: Install pinned production requirements in venv
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/kimi-e2e-venv"
          "$RUNNER_TEMP/kimi-e2e-venv/bin/python" -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple -r .github/ai-review/production/requirements.txt
      - name: Exercise complete runner with read-only GitHub token
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/kimi-e2e-venv/bin/python" -B - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, ".github/ai-review/production")
          import runner as r
          from transport import OpenRouter, Problem
          
          CASES = ((16, "6721e83a5c5c2c1844c78f6d47e133962419fd90", 2),
                   (28, "219bfba2dcddabfd4ce7318157777c19a1319c40", 1))
          key, token = os.environ.get("OPENROUTER_API_KEY"), os.environ.get("GITHUB_TOKEN")
          if not key or not token:
              print('{"status":"credentials_unavailable"}')
              sys.exit(1)
          
          class DryGitHub(r.GitHub):
              """Read-only identity. There is NO API POST in this class."""
              would_publish = False
              def post(self, pinned, body):
                  self.would_publish = True
                  raise Problem("dry_run_publication_blocked")
          
          count = 0
          for number, sha, trials in CASES:
              for attempt in range(1, trials + 1):
                  gh = DryGitHub(token)
                  record = {"pr": number, "attempt": attempt, "published": False}
                  pr = gh.pr(number)
                  if (pr.get("head", {}).get("sha") != sha
                          or pr.get("state") != "open" or pr.get("draft") is not False
                          or pr.get("base", {}).get("ref") != "main"):
                      record["code"] = "identity_mismatch"
                      print(json.dumps(record, sort_keys=True))
                      sys.exit(1)
                  event = {"action": "opened", "number": number,
                           "repository": {"full_name": r.REPOSITORY,
                                          "default_branch": "main"},
                           "pull_request": pr}
                  model = OpenRouter(key, max_attempts=1, require_reasoning_usage=True)
                  outcome = r.run_review(event, "true", gh, model,
                              version="kimi-catalog-e2e-no-post-v1")
                  record.update({
                      "code": outcome.code, "stage": outcome.stage,
                      "would_publish": gh.would_publish,
                      "quality_hold_count": outcome.quality_hold_count,
                      "quality_duplicate_pair_count": outcome.quality_duplicate_pair_count,
                      "quality_quote_mismatch_count": outcome.quality_quote_mismatch_count,
                      "quality_short_line_count": outcome.quality_short_line_count,
                      "quality_source_unavailable_count": outcome.quality_source_unavailable_count,
                      "quality_invalid_reference_count": outcome.quality_invalid_reference_count,
                  })
                  if outcome.validation_reason:
                      record["validation_reason"] = outcome.validation_reason
                  if model.last_usage is not None:
                      record["usage"] = model.last_usage
                  if model.last_reasoning_control in r.REASONING_CONTROL_CODES:
                      record["reasoning_control"] = model.last_reasoning_control
                  print(json.dumps(record, sort_keys=True), flush=True)
                  if outcome.published or (gh.would_publish and outcome.code != "publication_uncertain"):
                      sys.exit(1)
                  count += 1
          print(json.dumps({"status": "evaluation_complete", "calls_planned": 3,
                            "records": count, "published": False}, sort_keys=True))
          if count != 3:
              sys.exit(1)
          PY
