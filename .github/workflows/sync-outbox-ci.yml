name: SQLite Outbox Offline Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/sync_outbox.py"
      - "tests/unit/test_sync_outbox.py"
      - "docs/sincronizacao-local-v1.md"
      - ".github/workflows/sync-outbox-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/core/sync_outbox.py"
      - "tests/unit/test_sync_outbox.py"
      - "docs/sincronizacao-local-v1.md"
      - ".github/workflows/sync-outbox-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Run SQLite outbox tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.12 -B -m unittest -v tests.unit.test_sync_outbox
