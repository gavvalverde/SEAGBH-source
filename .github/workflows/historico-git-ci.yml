name: Proteger historicos administrativos no Git

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: historico-git-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventario:
    name: historico-git
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sem credenciais persistidas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Regressao de metadados sinteticos
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest -v tests.unit.test_protecao_historicos_git
      - name: Recusar novos historicos rastreados e modificacoes dos legados
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B tools/protecao_historicos_git.py
