name: Installation Identity Offline Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/identidade_instalacao.py"
      - "tests/unit/licenciamento/test_identidade_instalacao.py"
      - "docs/identidade-instalacao-v1.md"
      - ".github/workflows/identidade-instalacao-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/core/identidade_instalacao.py"
      - "tests/unit/licenciamento/test_identidade_instalacao.py"
      - "docs/identidade-instalacao-v1.md"
      - ".github/workflows/identidade-instalacao-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Identity offline (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 5
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Test persistent installation identity offline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest -v tests.unit.licenciamento.test_identidade_instalacao
