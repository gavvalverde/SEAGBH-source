name: Installation Identity Offline Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/identidade_instalacao.py"
      - "tests/unit/licenciamento/test_identidade_instalacao.py"
      - "docs/identidade-instalacao-v1.md"
      - ".github/workflows/identidade-instalacao-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/core/identidade_instalacao.py"
      - "tests/unit/licenciamento/test_identidade_instalacao.py"
      - "docs/identidade-instalacao-v1.md"
      - ".github/workflows/identidade-instalacao-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Test persistent installation identity offline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.12 -B -m unittest -v tests.unit.licenciamento.test_identidade_instalacao
