name: One-shot Kimi consistency eval for PR16 and PR28
on:
  push:
    branches: [fix/ai-review-kimi-structured-evidence]
    paths:
      - ".github/workflows/kimi-quality-eval-one-shot.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluation:
    if: >-
      github.repository == 'gavvalverde/SEAGBH-source' &&
      github.event.head_commit.message == 'test(ai-review): medir consistencia Kimi sem publicar' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate sources without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gavvalverde/SEAGBH-source
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/ai-review/production/
            /.github/ai-review/benchmarks/harness/prompt_builder.py
            /.github/ai-review/review-schema.json
      - name: Install pinned reviewer requirements in isolated venv
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/kimi-consistency-venv"
          "$RUNNER_TEMP/kimi-consistency-venv/bin/python" -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple -r .github/ai-review/production/requirements.txt
      - name: Execute four bounded dry-run trials
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/kimi-consistency-venv/bin/python" -B - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, ".github/ai-review/production")
          import runner as r
          import core
          import quality_gate
          from transport import OpenRouter, Problem
          
          # PRs and immutable head SHAs are prechecked against GitHub before each model call.
          CASES = ((16, "6721e83a5c5c2c1844c78f6d47e133962419fd90", 3),
                   (28, "219bfba2dcddabfd4ce7318157777c19a1319c40", 1))
          key = os.environ.get("OPENROUTER_API_KEY")
          token = os.environ.get("GITHUB_TOKEN")
          if not key or not token:
              print('{"evaluation":"missing_credentials"}')
              sys.exit(1)
          github = r.GitHub(token)
          results = []
          for number, wanted, repetitions in CASES:
              for trial in range(1, repetitions + 1):
                  record = {"pr": number, "trial": trial, "published": False}
                  try:
                      data = github.pr(number)
                      if (data.get("head", {}).get("sha") != wanted
                              or data.get("state") != "open"
                              or data.get("draft") is not False
                              or data.get("base", {}).get("ref") != "main"):
                          record["code"] = "identity_mismatch"
                          results.append(record)
                          continue
                      event = {"number": number, "action": "opened",
                               "repository": {"full_name": r.REPOSITORY, "default_branch": "main"},
                               "pull_request": data}
                      pinned = r.event_snapshot(event, "true")
                      r.ensure_current(github, pinned)
                      collected = r.collect(github, pinned)
                      excerpts = r.source_context(github, pinned, collected)
                      title = pinned.title.encode("utf-8")[:1024].decode("utf-8", errors="ignore")
                      body = pinned.body.encode("utf-8")[:4096].decode("utf-8", errors="ignore")
                      collected.manifest["partial"] |= title != pinned.title or body != pinned.body
                      context = dict(collected.manifest)
                      if excerpts:
                          context["source_snippets"] = excerpts
                      payload = r.build_production_payload(
                          title, body, collected.diff,
                          context=json.dumps(context, ensure_ascii=True, sort_keys=True),
                          trunc_note="[PARTIAL REVIEW]" if collected.manifest["partial"] else "",
                          omit_info=json.dumps(collected.manifest["omitted"], ensure_ascii=True)
                              if collected.manifest["omitted"] else "",
                      )
                      # Safety invariant: do not permit any automatic fallback or retry.
                      assert payload["model"] == "moonshotai/kimi-k2.6"
                      assert payload["provider"]["only"] == ["baidu"]
                      assert payload["provider"]["allow_fallbacks"] is False
                      assert payload["provider"]["require_parameters"] is True
                      assert payload["response_format"]["type"] == "json_schema"
                      assert payload["reasoning"] == {"enabled": False}
                      model = OpenRouter(key, max_attempts=1, require_reasoning_usage=True)
                      content = model.complete(payload)  # the ONE paid request for this trial
                      record["usage"] = model.last_usage
                      record["reasoning_control"] = model.last_reasoning_control
                      r.ensure_current(github, pinned)
                      result = core.process_response(content, collected.scope,
                              expected_sha=pinned.head_sha, response_sha=pinned.head_sha)
                      record["validation"] = result.status.value
                      if not result.publishable:
                          record["code"] = "validation_rejected"
                          record["validation_reason"] = result.reason
                      else:
                          review = result.review
                          assessment = quality_gate.assess(review["findings"], collected.code_lines)
                          record.update({
                              "findings_count": len(review["findings"]),
                              "quality_hold_count": assessment.unanchored_count,
                              "quote_mismatch_count": assessment.quote_mismatch_count,
                              "short_line_count": assessment.short_line_count,
                              "source_unavailable_count": assessment.source_unavailable_count,
                              "invalid_reference_count": assessment.invalid_reference_count,
                              "duplicate_location_pairs": assessment.duplicate_location_pairs,
                              "rejected_scope_count": len(result.rejected),
                          })
                          # This only means the format/evidence gates passed, not causal correctness.
                          record["code"] = ("quality_rejected" if assessment.requires_manual_review
                                            else "gates_passed_no_publication")
                  except Problem as error:
                      record["code"] = error.code
                  except Exception:
                      record["code"] = "unexpected_execution_error"
                  results.append(record)
                  # Only fixed field labels, fixed reason codes and bounded numeric telemetry.
                  print(json.dumps(record, sort_keys=True), flush=True)
                  if record["code"] in ("identity_mismatch", "unexpected_execution_error"):
                      sys.exit(1)
          print(json.dumps({"evaluation": "finished", "calls_planned": 4,
                            "records": len(results), "published": False}, sort_keys=True))
          if len(results) != 4:
              sys.exit(1)
          PY
